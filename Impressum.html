<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressum - Double In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Protest+Guerrilla&family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (window.innerWidth <= 768) {
            window.location.replace("Impressum-mobile.html");
        }
    </script>
</head>
<body>
    <div data-sidebar></div>

    <div class="back-button">
        <a href="index.html">« Zurück</a>
    </div>

    <main class="page-content impressum-page">
        <header class="content-page-heading">
            <span class="content-page-kicker">Double In</span>
            <h1>Impressum</h1>
        </header>

        <div class="impressum-layout">
            <div class="impressum-card address-card" role="region" aria-label="Anschrift">
                <span class="card-eyebrow">Anschrift</span>
                <address>
                    <strong>Michael Friedrich</strong>
                    <span>Double In</span>
                    <span>Horststraße 66</span>
                    <span>47137 Duisburg - Untermeiderich</span>
                </address>
            </div>

            <div class="contact-cards" aria-label="Kontakt">
                <a href="tel:020336958666" class="impressum-card contact-card">
                    <span class="contact-card-icon" aria-hidden="true">☎</span>
                    <span class="contact-card-copy">
                        <span class="card-eyebrow">Telefon</span>
                        <strong>0203 36958666</strong>
                    </span>
                    <span class="contact-card-arrow" aria-hidden="true">↗</span>
                </a>
                <a href="mailto:double-in@gmx.de" class="impressum-card contact-card">
                    <span class="contact-card-icon" aria-hidden="true">@</span>
                    <span class="contact-card-copy">
                        <span class="card-eyebrow">Email</span>
                        <strong>double-in@gmx.de</strong>
                    </span>
                    <span class="contact-card-arrow" aria-hidden="true">↗</span>
                </a>
            </div>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
