<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öffnungszeiten - Double In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Protest+Guerrilla&family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (window.innerWidth <= 768) {
            window.location.replace("Oeffnungszeiten-mobile.html");
        }
    </script>
</head>
<body>
    <div data-sidebar></div>

    <div class="back-button">
        <a href="index.html">« Zurück</a>
    </div>

    <main class="page-content hours-page">
        <header class="content-page-heading">
            <span class="content-page-kicker">Double In</span>
            <h1>Öffnungszeiten</h1>
        </header>

        <div class="hours-panel" role="region" aria-label="Öffnungszeiten">
            <div class="hours-row"><span class="hours-day">Montag</span><span class="hours-time">Ruhetag</span></div>
            <div class="hours-row"><span class="hours-day">Dienstag</span><span class="hours-time">14:00 – 23:00 Uhr</span></div>
            <div class="hours-row"><span class="hours-day">Mittwoch</span><span class="hours-time">14:00 – 23:00 Uhr</span></div>
            <div class="hours-row"><span class="hours-day">Donnerstag</span><span class="hours-time">14:00 – 23:00 Uhr</span></div>
            <div class="hours-row"><span class="hours-day">Freitag</span><span class="hours-time">12:00 – Open End</span></div>
            <div class="hours-row"><span class="hours-day">Samstag</span><span class="hours-time">14:00 – Open End</span></div>
            <div class="hours-row"><span class="hours-day">Sonntag</span><span class="hours-time">Nur bei Auswärtsspiel MSV</span></div>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
